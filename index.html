            <h1 class="text-2xl font-bold text-yellow_hl">PENA-9</h1>
            <p class="text-sm mt-1">Presensi Elektronik SMA Negeri 9 Surabaya</p>
        </div>

        <form id="penaForm" class="p-6 space-y-4">
            <div>
                <label class="block text-sm font-semibold text-gray-700">Nama Wali Murid</label>
                <input type="text" id="namaWali" required class="w-full mt-1 p-2 border rounded focus:ring-2 focus:ring-yellow_hl focus:border-navy outline-none">
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700">Email Wali Murid</label>
                <input type="email" id="emailWali" required class="w-full mt-1 p-2 border rounded focus:ring-2 focus:ring-yellow_hl focus:border-navy outline-none">
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700">Nama Siswa</label>
                <input type="text" id="namaSiswa" required class="w-full mt-1 p-2 border rounded focus:ring-2 focus:ring-yellow_hl focus:border-navy outline-none">
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700">Kelas Siswa</label>
                <select id="kelasSiswa" required class="w-full mt-1 p-2 border rounded focus:ring-2 focus:ring-yellow_hl focus:border-navy outline-none">
                    <option value="" disabled selected>Pilih Kelas</option>
                    <optgroup label="Kelas X">
                        <option>X-1</option><option>X-2</option><option>X-3</option><option>X-4</option><option>X-5</option>
                        <option>X-6</option><option>X-7</option><option>X-8</option><option>X-9</option><option>X-10</option>
                    </optgroup>
                    <optgroup label="Kelas XI">
                        <option>XI-A1</option><option>XI-A2</option><option>XI-A3</option><option>XI-A4</option>
                        <option>XI-B</option><option>XI-C1</option><option>XI-C2</option><option>XI-C3</option>
                        <option>XI-D1</option><option>XI-D2</option>
                    </optgroup>
                    <optgroup label="Kelas XII">
                        <option>XII-A1</option><option>XII-A2</option><option>XII-A3</option><option>XII-A4</option>
                        <option>XII-B</option><option>XII-C1</option><option>XII-C2</option><option>XII-C3</option>
                        <option>XII-C4</option><option>XII-D</option>
                    </optgroup>
                </select>
            </div>

            <!-- Kamera & Lokasi -->
            <div class="pt-2">
                <label class="block text-sm font-semibold text-gray-700 mb-2">Swafoto (Selfie) Presensi</label>
                <input type="file" id="fotoKamera" accept="image/*" capture="user" required class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-navy file:text-white hover:file:bg-blue-800 transition">
                <p class="text-xs text-gray-400 mt-1">*Kamera depan akan otomatis terbuka</p>
            </div>

            <button type="submit" id="btnSubmit" class="w-full bg-navy text-yellow_hl font-bold py-3 px-4 rounded-lg hover:bg-blue-900 transition flex justify-center items-center mt-4">
                Kirim Presensi
            </button>
        </form>
    </div>

    <script>
        // GANTI DENGAN URL WEB APP DARI GOOGLE APPS SCRIPT
        const GAS_URL = "https://script.google.com/macros/s/AKfycbxuPJtgb56bWYIkYcRBxTqEnnVfRvm32jHDdI2qARGYHXln89SZb6Yko96l0hgpS1oaCw/exec"; 

        document.getElementById('penaForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('btnSubmit');
            btn.innerHTML = 'Memproses Lokasi & Data...';
            btn.disabled = true;

            // 1. Dapatkan Lokasi
            navigator.geolocation.getCurrentPosition(async function(position) {
                const lokasi = position.coords.latitude + ", " + position.coords.longitude;
                
                // 2. Proses Foto menjadi Base64
                const file = document.getElementById('fotoKamera').files[0];
                const reader = new FileReader();
                reader.onloadend = async function() {
                    const data = {
                        namaWali: document.getElementById('namaWali').value,
                        emailWali: document.getElementById('emailWali').value,
                        namaSiswa: document.getElementById('namaSiswa').value,
                        kelasSiswa: document.getElementById('kelasSiswa').value,
                        lokasi: lokasi,
                        fotoBase64: reader.result
                    };

                    // 3. Kirim ke Google Apps Script
                    try {
                        await fetch(GAS_URL, {
                            method: "POST",
                            body: JSON.stringify(data) // Vercel -> GAS aman dikirim dalam bentuk string
                        });
                        alert("Presensi Berhasil! Rekap telah dikirim ke email Anda.");
                        document.getElementById('penaForm').reset();
                    } catch (error) {
                        alert("Berhasil dicatat, namun ada gangguan koneksi saat mengirim laporan.");
                    }
                    btn.innerHTML = 'Kirim Presensi';
                    btn.disabled = false;
                };
                reader.readAsDataURL(file);
                
            }, function(error) {
                alert("Mohon izinkan akses lokasi (GPS) untuk melanjutkan presensi.");
                btn.innerHTML = 'Kirim Presensi';
                btn.disabled = false;
            });
        });
    </script>
</body>
